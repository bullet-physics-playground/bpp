name: Tests

# Builds bpp on Linux and runs tests/harness.py: the Lua unit tests, the Lua
# API snapshot, a smoke run of every demo, golden-master comparisons of demo
# physics and POV-Ray export, and screenshots on a virtual screen.
#
# The expected files under tests/ were made on Ubuntu 24.04 with its own
# packages (GCC, Bullet, Mesa). Keep this job on that image: another
# compiler or Mesa can move numbers or pixels slightly and fail a test that
# has nothing wrong with it.

on:
  push:
  pull_request:
  workflow_dispatch:
  # Once a week, the theory job also runs Euler's Gallery's slow exhibits.
  schedule:
    - cron: '23 9 * * 0'

permissions:
  contents: read

# bpp builds with Qt 5 or Qt 6. These jobs build with Qt 5, as Ubuntu 22.04
# and 24.04 do (their Qt 6 has no libQGLViewer package); test-qt6 builds
# with Qt 6. debian/control lists Qt 6 (Debian packages Qt 6's
# libQGLViewer), so the Qt 5 build's packages are named here.
env:
  QT5_BUILD_DEPS: >-
    pkg-config qt5-qmake qtbase5-dev qttools5-dev-tools libqt5opengl5-dev
    libqglviewer-dev-qt5 libglew-dev libluabind-dev liblua5.1-dev
    libbullet-dev libassimp-dev libsdl2-dev libsdl2-mixer-dev lsb-release
    help2man

defaults:
  run:
    # (Named explicitly so steps run with -eo pipefail: "| tee" keeps the
    # harness's exit status.)
    shell: bash

jobs:
  test-linux:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends $QT5_BUILD_DEPS
          # libqt5svg5 is a runtime dependency, not a build one: without it
          # the GUI's toolbar icons (SVG) are blank in the screenshots.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation fonts-dejavu-core libqt5svg5 \
            xvfb xdotool imagemagick libgl1-mesa-dri

      - name: Build
        id: build
        run: |
          qmake CONFIG+=release
          make -j"$(nproc)" release

      # Each test step runs even when an earlier one failed, so one run
      # shows everything that broke.
      - name: Unit tests, Lua API and quick render
        run: python3 tests/harness.py unit api render 2>&1 | tee unit-api.log

      - name: Golden master (physics and POV-Ray export)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py --keep golden 2>&1 | tee golden.log

      - name: Screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py --keep screens 2>&1 | tee screens.log

      - name: Smoke run of every demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py smoke 2>&1 | tee smoke.log

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: |
            *.log
            /tmp/bpp-tests-*/screens-*.png
            /tmp/bpp-tests-*/golden-got/
          if-no-files-found: ignore

  test-sanitizers:
    name: AddressSanitizer + UBSan (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Leaks are checked too: lsan.supp leaves out what Qt keeps to the end.
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp
      UBSAN_OPTIONS: print_stacktrace=1:suppressions=${{ github.workspace }}/tests/sanitizers/ubsan.supp
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends $QT5_BUILD_DEPS
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation

      - name: Build with sanitizers
        run: |
          qmake CONFIG+=release CONFIG+=sanitizer CONFIG+=sanitize_address CONFIG+=sanitize_undefined
          make -j"$(nproc)" release

      # The golden master is compared with the same expected files as the
      # normal build: on this platform the sanitizer build gives the same
      # numbers. Left out: 08-remove.lua measures the process's memory to
      # check removed objects are freed; AddressSanitizer keeps freed memory
      # back on purpose.
      - name: Unit tests, Lua API and golden master under sanitizers
        run: python3 tests/harness.py -k '^(?!08-remove)' unit api golden

  # The threaded build (THREADS.md): Bullet 3.24 built with threads
  # (scripts/bullet-threads.sh) and bpp against it. With no threads asked
  # for it gives the same numbers as the system Bullet, so the golden
  # master's expected files hold; tests/22-threads.lua runs a scene with
  # and without four threads and wants the same to the last digit.
  test-threads:
    name: Threaded build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends $QT5_BUILD_DEPS
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation cmake

      - name: Build Bullet with threads
        run: scripts/bullet-threads.sh

      - name: Build
        run: |
          qmake CONFIG+=release CONFIG+=bundled_bullet
          make -j"$(nproc)" release

      - name: Unit tests, Lua API and golden master
        run: python3 tests/harness.py unit api golden

  # The threaded build again, Bullet and bpp both built with
  # ThreadSanitizer, running the unit tests (tests/22-threads.lua among
  # them). tests/sanitizers/tsan.supp names what is left out: races in
  # Bullet's own thread pool and statistics counter, and in PulseAudio.
  test-tsan:
    name: ThreadSanitizer (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/tsan.supp history_size=4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends $QT5_BUILD_DEPS
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation cmake

      # Ubuntu 24.04's kernel spreads memory wider than ThreadSanitizer
      # supports ("FATAL: ThreadSanitizer: unexpected memory mapping").
      - name: Let ThreadSanitizer map its memory
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build Bullet with threads, under ThreadSanitizer
        run: CFLAGS=-fsanitize=thread CXXFLAGS=-fsanitize=thread scripts/bullet-threads.sh

      - name: Build under ThreadSanitizer
        run: |
          qmake CONFIG+=release CONFIG+=bundled_bullet "QMAKE_CXXFLAGS+=-fsanitize=thread -g" "QMAKE_LFLAGS+=-fsanitize=thread"
          make -j"$(nproc)" release

      - name: Unit tests under ThreadSanitizer
        run: python3 tests/harness.py unit

  # Euler's Gallery's exhibits against the theory each stands for
  # (tests/theory/checks.txt, from the gallery's physics-fidelity report).
  # The slow ones (the Brazil nut, the Gomboc: half an hour together) run
  # only on the weekly schedule, or when the workflow is run by hand.
  test-theory:
    name: Euler's Gallery against theory (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends $QT5_BUILD_DEPS
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation

      - name: Build
        run: |
          qmake CONFIG+=release
          make -j"$(nproc)" release

      - name: The exhibits against theory
        run: |
          slow=
          case "${{ github.event_name }}" in schedule|workflow_dispatch) slow=--slow ;; esac
          python3 tests/harness.py $slow theory

  # The Qt 6 build. Ubuntu 24.04 packages Qt 6 but not its libQGLViewer, so
  # that is built from upstream's source (a fixed commit) and installed as
  # libQGLViewer.so, the name Debian's libqglviewer-dev-qt6 gives it. The
  # physics, the export and the Lua API are the same as with Qt 5, so the
  # unit tests, the API listing and the golden master use the same expected
  # files; Qt 6 lays out the window otherwise, so the screenshots have their
  # own (tests/screens/expected-qt6/).
  test-qt6:
    name: Qt 6 build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libqt6svg6 \
            libgl-dev libglu1-mesa-dev pkg-config libglew-dev libluabind-dev \
            liblua5.1-dev libbullet-dev libassimp-dev libsdl2-dev \
            libsdl2-mixer-dev lsb-release help2man
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation fonts-dejavu-core \
            xvfb xdotool imagemagick libgl1-mesa-dri

      - name: Build libQGLViewer for Qt 6
        run: |
          git clone -q https://github.com/GillesDebunne/libQGLViewer.git /tmp/libQGLViewer
          cd /tmp/libQGLViewer
          git checkout -q da4bfad
          cd QGLViewer
          qmake6
          make -j"$(nproc)"
          sudo make install
          sudo ln -sf libQGLViewer-qt6.so /usr/local/lib/libQGLViewer.so
          sudo ldconfig

      - name: Build
        id: build
        run: |
          qmake6 CONFIG+=release
          make -j"$(nproc)" release

      - name: Unit tests, Lua API, quick render and golden master
        run: python3 tests/harness.py unit api render golden

      - name: Screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py --keep screens

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output-qt6
          path: /tmp/bpp-tests-*/screens-*.png
          if-no-files-found: ignore

  # The Windows build, as the release's Windows installer is built (MSYS2
  # MinGW64, Qt 5, luabind and libQGLViewer from source; without POV-Ray
  # built in), running the suites whose expected files hold off Linux: the
  # unit tests and the smoke run (the harness skips the rest off Linux).
  # OpenSCAD is a development snapshot, with Manifold: 2021.01's CGAL is too
  # slow on Windows for duplo.lua. The Linux jobs keep Ubuntu's 2021.01, so
  # CI runs the demos with both engines.
  test-windows:
    name: Windows build (MSYS2 MinGW64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          release: false
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-assimp
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-lua51
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-bullet
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-python

      # Siblings of the checkout, where msys2.pri looks for them. The same
      # libQGLViewer commit as the Qt 6 job.
      - name: Build luabind and libQGLViewer
        run: |
          set -e
          cd "$(dirname "$(cygpath -u '${{ github.workspace }}')")"
          git clone -q --depth=1 https://github.com/bullet-physics-playground/luabind
          (cd luabind && mkdir build && cd build &&
           cmake -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -G Ninja .. && ninja)
          git clone -q https://github.com/GillesDebunne/libQGLViewer
          cd libQGLViewer && git checkout -q da4bfad && cd QGLViewer
          qmake-qt5
          mingw32-make -j$(nproc)

      - name: Build
        id: build
        run: |
          set -e
          qmake-qt5 CONFIG+=release
          mingw32-make -j$(nproc) release

      # An official Windows snapshot, unpacked into C:\Program Files\OpenSCAD
      # where bpp looks first. OPENSCAD_SNAPSHOT pins the zip, so a new nightly
      # can't change the results; empty takes the newest one in OpenSCAD's
      # download index and prints its name (to pin a newer one, or if this
      # one is ever taken off files.openscad.org).
      - name: Install OpenSCAD (development snapshot)
        shell: pwsh
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.10.05-x86-64.zip
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://files.openscad.org/snapshots'
          $zip = $env:OPENSCAD_SNAPSHOT
          if (-not $zip) {
            $index = (Invoke-WebRequest "$base/.snapshot_win64.js" -UseBasicParsing).Content
            $zip = ([regex]::Matches($index, 'OpenSCAD-[0-9.]+-x86-64\.zip') |
                    ForEach-Object Value | Sort-Object -Unique | Select-Object -Last 1)
            if (-not $zip) { throw "no x86-64 zip in $base/.snapshot_win64.js:`n$index" }
          }
          Write-Host "OpenSCAD snapshot: $zip"
          Invoke-WebRequest "$base/$zip" -OutFile "$env:RUNNER_TEMP\openscad.zip"
          Expand-Archive "$env:RUNNER_TEMP\openscad.zip" "$env:RUNNER_TEMP\openscad"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\openscad" -Recurse -Filter openscad.exe |
                 Select-Object -First 1
          Copy-Item $exe.DirectoryName 'C:\Program Files\OpenSCAD' -Recurse
          $com = 'C:\Program Files\OpenSCAD\openscad.com'
          if (Test-Path $com) { & $com --version } else { & 'C:\Program Files\OpenSCAD\openscad.exe' --version }

      # (bpp.exe finds MSYS2's DLLs on PATH; QGLViewer's is beside its build.)
      - name: Unit tests
        run: |
          set -eo pipefail
          export PATH="$(dirname "$PWD")/libQGLViewer/QGLViewer:$PATH"
          python tests/harness.py --bpp release/bpp.exe unit 2>&1 | tee unit.log

      - name: Smoke run of every demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eo pipefail
          export PATH="$(dirname "$PWD")/libQGLViewer/QGLViewer:$PATH"
          python tests/harness.py --bpp release/bpp.exe smoke 2>&1 | tee smoke.log

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output-windows
          path: '*.log'
          if-no-files-found: ignore

  # The macOS build, as the release's arm64 disk image is built (Homebrew,
  # Qt 5, luabind and libQGLViewer from source) but without POV-Ray built
  # in, and the unit tests and the smoke run, as on Windows (the other
  # suites' expected files are made on Linux). Homebrew's Lua is 5.4, where
  # Linux and Windows have 5.1, as the release's disk images do.
  # continue-on-error while this job is new, as the Windows job was: a
  # failure here shows on the job but leaves the run green. Drop it once
  # the job has passed for a while.
  test-macos:
    name: macOS build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies (Homebrew)
        run: brew install qt@5 assimp cmake bullet lua boost sdl2 sdl2_mixer

      # Into the Homebrew prefix and /Library/Frameworks, where bpp.pro's mac
      # block looks. The same libQGLViewer commit as the Qt 6 and Windows
      # jobs.
      - name: Build luabind and libQGLViewer
        run: |
          set -e
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          cd "$(dirname "$GITHUB_WORKSPACE")"
          git clone -q --depth=1 https://github.com/bullet-physics-playground/luabind
          (cd luabind && mkdir build && cd build &&
           cmake -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -DCMAKE_INSTALL_PREFIX="$(brew --prefix)" .. &&
           make -j"$(sysctl -n hw.ncpu)" && sudo make install)
          git clone -q https://github.com/GillesDebunne/libQGLViewer
          cd libQGLViewer && git checkout -q da4bfad && cd QGLViewer
          qmake
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

      - name: Build
        id: build
        run: |
          set -e
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          qmake CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)" release

      # An official macOS snapshot (universal), copied to /Applications where
      # bpp looks first. Pinned, as the Windows job's is; macOS snapshots
      # come less often, so this is the one nearest that job's.
      - name: Install OpenSCAD (development snapshot)
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.10.11.dmg
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/openscad.dmg" "https://files.openscad.org/snapshots/$OPENSCAD_SNAPSHOT"
          hdiutil attach -nobrowse -quiet -mountpoint "$RUNNER_TEMP/openscad" "$RUNNER_TEMP/openscad.dmg"
          cp -R "$RUNNER_TEMP/openscad/OpenSCAD.app" /Applications/
          hdiutil detach -quiet "$RUNNER_TEMP/openscad"
          /Applications/OpenSCAD.app/Contents/MacOS/OpenSCAD --version

      - name: Unit tests
        run: |
          set -eo pipefail
          python3 tests/harness.py --bpp release/bpp.app/Contents/MacOS/bpp unit 2>&1 | tee unit.log

      - name: Smoke run of every demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eo pipefail
          python3 tests/harness.py --bpp release/bpp.app/Contents/MacOS/bpp smoke 2>&1 | tee smoke.log

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output-macos
          path: '*.log'
          if-no-files-found: ignore
