name: Tests

# Builds bpp on Linux and runs tests/harness.py: the Lua unit tests, the Lua
# API snapshot, a smoke run of every demo, golden-master comparisons of demo
# physics and POV-Ray export, and screenshots on a virtual screen.
#
# The expected files under tests/ were made on Ubuntu 24.04 with its own
# packages (GCC, Bullet, Mesa). Keep this job on that image: another
# compiler or Mesa can move numbers or pixels slightly and fail a test that
# has nothing wrong with it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # (Named explicitly so steps run with -eo pipefail: "| tee" keeps the
    # harness's exit status.)
    shell: bash

jobs:
  test-linux:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            devscripts equivs
          sudo mk-build-deps -i -t "apt-get -y -qq --no-install-recommends" debian/control
          # libqt5svg5 is a runtime dependency, not a build one: without it
          # the GUI's toolbar icons (SVG) are blank in the screenshots.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation fonts-dejavu-core libqt5svg5 \
            xvfb xdotool imagemagick libgl1-mesa-dri

      - name: Build
        id: build
        run: |
          qmake CONFIG+=release
          make -j"$(nproc)" release

      # Each test step runs even when an earlier one failed, so one run
      # shows everything that broke.
      - name: Unit tests and Lua API
        run: python3 tests/harness.py unit api 2>&1 | tee unit-api.log

      - name: Golden master (physics and POV-Ray export)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py --keep golden 2>&1 | tee golden.log

      - name: Screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py --keep screens 2>&1 | tee screens.log

      - name: Smoke run of every demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/harness.py smoke 2>&1 | tee smoke.log

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: |
            *.log
            /tmp/bpp-tests-*/screens-*.png
            /tmp/bpp-tests-*/golden-got/
          if-no-files-found: ignore

  test-sanitizers:
    name: AddressSanitizer + UBSan (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Leaks are not checked yet: Qt and luabind leave a lot allocated at exit.
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:suppressions=${{ github.workspace }}/tests/sanitizers/ubsan.supp
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            devscripts equivs
          sudo mk-build-deps -i -t "apt-get -y -qq --no-install-recommends" debian/control
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openscad fonts-liberation

      - name: Build with sanitizers
        run: |
          qmake CONFIG+=release CONFIG+=sanitizer CONFIG+=sanitize_address CONFIG+=sanitize_undefined
          make -j"$(nproc)" release

      # The golden master is compared with the same expected files as the
      # normal build: on this platform the sanitizer build gives the same
      # numbers. Left out: 08-remove.lua measures the process's memory to
      # check removed objects are freed; AddressSanitizer keeps freed memory
      # back on purpose.
      - name: Unit tests, Lua API and golden master under sanitizers
        run: python3 tests/harness.py -k '^(?!08-remove)' unit api golden
