name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build .deb for ${{ matrix.distro }} ${{ matrix.codename }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu
          - distro: ubuntu
            codename: noble
            version: "24.04"
            arch: amd64
          - distro: ubuntu
            codename: noble
            version: "24.04"
            arch: arm64
          - distro: ubuntu
            codename: resolute
            version: "26.04"
            arch: amd64
          - distro: ubuntu
            codename: resolute
            version: "26.04"
            arch: arm64
          # Debian
          - distro: debian
            codename: bookworm
            version: "12"
            arch: amd64
          - distro: debian
            codename: bookworm
            version: "12"
            arch: arm64
          - distro: debian
            codename: trixie
            version: "13"
            arch: amd64
          - distro: debian
            codename: trixie
            version: "13"
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build package
        run: |
          ARCH="${{ matrix.arch }}"
          CODENAME="${{ matrix.codename }}"
          VERSION="${{ github.ref_name }}-1${CODENAME}"
          PLATFORM="linux/amd64"
          [ "$ARCH" = "arm64" ] && PLATFORM="linux/arm64/v8"

          WORKSPACE_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          REPO_DIR="$(basename "$GITHUB_WORKSPACE")"

          docker run --platform "$PLATFORM" --rm \
            -v "${WORKSPACE_PARENT}:/workspace" \
            -w "/workspace/${REPO_DIR}" \
            -e VERSION="${VERSION}" \
            -e CODENAME="${CODENAME}" \
            -e REPO_DIR="${REPO_DIR}" \
            -e DISTRO="${{ matrix.distro }}" \
            ${{ matrix.distro }}:"${CODENAME}" bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq build-essential devscripts debhelper dh-make equivs
            mk-build-deps -i -t "apt --yes --no-install-recommends"
            sed -i "1s/.*/bpp (${VERSION}) ${CODENAME}; urgency=medium/" debian/changelog
            dpkg-buildpackage -b -uc -us -d
            mkdir -p "/workspace/${REPO_DIR}/deb-output"
            find /workspace -path "*/deb-output" -prune -o -type f \( -name "*.deb" -o -name "*.dsc" \) -print | while read -r f; do cp "$f" "/workspace/${REPO_DIR}/deb-output/"; done
            '
        env:
          DEB_BUILD_OPTIONS: nocheck

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bpp-deb-${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.arch }}
          path: deb-output/
          if-no-files-found: ignore

  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Package list follows the "Build on Windows with MSYS2" wiki page,
      # minus qt-creator and github-cli (IDE/CLI conveniences, not build deps).
      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-assimp
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-lua51
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-bullet
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-nsis

      # luabind and libQGLViewer are custom/forked builds not packaged by
      # MSYS2, built from source as siblings of the bpp checkout dir to
      # match msys2.pri's `HOME = $$PWD/..` layout.
      - name: Build luabind (bullet-physics-playground fork)
        run: |
          set -e
          PARENT="$(dirname "$(cygpath -u '${{ github.workspace }}')")"
          cd "$PARENT"
          git clone https://github.com/bullet-physics-playground/luabind --depth=1
          cd luabind && mkdir build && cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -G Ninja ..
          ninja

      - name: Build libQGLViewer
        run: |
          set -e
          PARENT="$(dirname "$(cygpath -u '${{ github.workspace }}')")"
          cd "$PARENT"
          git clone https://github.com/GillesDebunne/libQGLViewer --depth=1
          cd libQGLViewer/QGLViewer
          qmake-qt5
          mingw32-make -j$(nproc)

      - name: Build bpp
        run: |
          set -e
          qmake-qt5
          mingw32-make -j$(nproc)

      - name: Deploy Qt runtime and remaining DLLs
        run: |
          set -e
          windeployqt-qt5.exe --release --compiler-runtime --angle release/bpp.exe
          cp /mingw64/bin/SDL2.dll release/
          cp /mingw64/bin/lua51.dll release/
          cp /mingw64/bin/libLinearMath.dll release/
          cp /mingw64/bin/libBullet* release/
          cp /mingw64/bin/libassimp-6.dll release/
          PARENT="$(dirname "$(cygpath -u '${{ github.workspace }}')")"
          cp "$PARENT/libQGLViewer/QGLViewer/QGLViewer3.dll" release/

      - name: Build NSIS installer
        run: |
          set -e
          sed -i 's/^!define VERSION .*/!define VERSION "${{ github.ref_name }}"/' bpp.nsi
          makensis.exe bpp.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bpp-windows-x64
          path: bpp-*-win-x64.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release-packages
          find artifacts -type f \( -name "*.deb" -o -name "*.dsc" -o -name "*.exe" \) | while read -r file; do
            cp "$file" release-packages/
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-packages/*
          generate_release_notes: true
