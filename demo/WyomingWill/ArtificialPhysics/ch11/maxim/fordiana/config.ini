sensor_number           1       # number of active sensors
0                               # sensor angle postion in degrees (e.g. 0 means sensor facing straight ahead)

world_width             750
world_height            750

sim_speed_ms            0       # controls simulation speed - graphics

time_steps              50000000 # total number of time steps, was 10,000,000
sampling_step           10000    # write to file sample interval

sensor_range            17      # the fixed sensor range of the agent
response_range          1.0     # the obstacle detection threshold
response_range_step     15.0    # increment step, was 0.1
response_range_max      15.0    # the maximum response range

agent_number            1       # number of agents in the swarm
agent_radius            4.5     # size of the agent - graphics
agent_mass              1.0     # mass of the agent

wall_mass               1.0     # mass of the wall
wall_width              3       # width of wall in pixels - graphics

R                       65.0    # desired distance between agents
agent_agent_force_law   1       # 0 - Newtonian, 1 - Lennard-Jones, 2 - Hooke
agent_wall_force_law    0       # 0 - Newtonian, 1 - Lennard-Jones, 2 - Hooke

max_V                   0.8     # maximum agent velocity
G                       36.0    # gravitational constant
p                       2.0     # (distance_between_objects) ^ p
k                       0.005   # spring constant
friction                1.0     # friction ( 1 - no friction, 0 - full friction )
step                    1.0     # time step - physics related

PI                      3.141592653589793238462643
